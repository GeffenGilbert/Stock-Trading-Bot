name: Bot Night

on:
  workflow_dispatch:
  schedule:
    # 3:58 PM ET during daylight saving time (EDT = UTC-4)
    - cron: "58 19 * * 1-5"

concurrency:
  group: bot-night
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: ${{ vars.ALPACA_PAPER }}
      STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT }}
      TAKE_PROFIT_PCT: ${{ vars.TAKE_PROFIT_PCT }}
      FAKE_BUY_SELL: ${{ vars.FAKE_BUY_SELL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run night mode
        run: python main.py night
